<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="auto">
  <defs>
    <linearGradient id="fsmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4" />   <stop offset="35%" stop-color="#4caf50" />  <stop offset="70%" stop-color="#ff9800" />  <stop offset="100%" stop-color="#f44336" /> </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" />
    </pattern>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" />
  
  <rect width="100%" height="100%" fill="url(#grid)" />

  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1.5">RS50H</text>
  <text x="225" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#8b949e" letter-spacing="-0.5">Thermal Controller</text>

  <text x="50" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#c9d1d9" font-weight="500">Firmware fail-safe open-source para motores BLDC (Hoverboard)</text>
  <text x="50" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" font-weight="400">ESP32-S3 • PWM 25 kHz • Telemetria WebSocket • Sim-Racing</text>

  <g transform="translate(670, 62)">
    <rect width="80" height="30" rx="15" fill="#238636" />
    <text x="40" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.0.1</text>
  </g>

  <rect x="50" y="195" width="700" height="6" rx="3" fill="url(#fsmGradient)" />

  <circle cx="50" cy="198" r="6" fill="#0d1117" stroke="#00bcd4" stroke-width="3" filter="url(#glow)"/>
  <text x="50" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#00bcd4" text-anchor="middle">IDLE</text>

  <circle cx="280" cy="198" r="6" fill="#0d1117" stroke="#4caf50" stroke-width="3" filter="url(#glow)"/>
  <text x="280" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4caf50" text-anchor="middle">WARMING</text>
  <text x="280" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">40 °C</text>

  <circle cx="510" cy="198" r="6" fill="#0d1117" stroke="#ff9800" stroke-width="3" filter="url(#glow)"/>
  <text x="510" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ff9800" text-anchor="middle">WARNING</text>
  <text x="510" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">60 °C</text>

  <circle cx="750" cy="198" r="6" fill="#0d1117" stroke="#f44336" stroke-width="3" filter="url(#glow)"/>
  <text x="750" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f44336" text-anchor="middle">CRITICAL</text>
  <text x="750" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">68 °C</text>

</svg>
